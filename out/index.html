<style>
  :root{
    --bg:#FAF7F5; --card:#FFFFFF; --ink:#2B2724; --sub:#8B807A;
    --line:#ECE2DC; --accent:#B9705C; --accent-soft:#FBEEE9; --accent-deep:#98543F;
    --green:#06C755; --radius:14px;
    --shadow:0 1px 2px rgba(43,39,36,.05), 0 8px 24px rgba(43,39,36,.06);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic Medium","Noto Sans JP","Segoe UI",system-ui,sans-serif;
    font-size:15px;line-height:1.65;overflow-x:hidden;-webkit-font-smoothing:antialiased;
  }
  .app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}

  /* ヘッダー / 進捗 */
  .hd{padding:16px 20px 12px;position:sticky;top:0;z-index:10;
      background:rgba(250,247,245,.93);backdrop-filter:blur(8px)}
  .hd h1{margin:0;font-size:13px;letter-spacing:.14em;font-weight:700;color:var(--accent-deep)}
  .hd h1 em{font-style:normal;color:var(--sub);font-weight:400;letter-spacing:.02em;margin-left:6px}
  .bar{display:flex;gap:6px;margin-top:11px}
  .bar i{flex:1;height:4px;border-radius:99px;background:var(--line);transition:background .35s}
  .bar i.on{background:var(--accent)}

  main{flex:1;padding:8px 20px 24px}
  .fade{animation:up .3s ease both}
  @keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  .q{margin:14px 0 4px;font-size:21px;font-weight:700;line-height:1.45;letter-spacing:.01em}
  .qs{margin:0 0 18px;color:var(--sub);font-size:12.5px}

  /* 選択肢 */
  .opts{display:grid;gap:9px}
  .opts.two{grid-template-columns:1fr 1fr}
  .opt{appearance:none;border:1.5px solid var(--line);background:var(--card);color:var(--ink);
       border-radius:var(--radius);padding:13px 12px;text-align:left;font:inherit;cursor:pointer;
       display:flex;align-items:center;gap:9px;transition:.16s;position:relative;width:100%}
  .opt .em{font-size:17px;line-height:1;flex:0 0 auto}
  .opt b{font-weight:600;font-size:13.5px;display:block;letter-spacing:-.01em}
  .opt small{display:block;color:var(--sub);font-size:11px;margin-top:2px;letter-spacing:-.01em}
  .opt:active{transform:scale(.985)}
  .opt.sel{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 3px rgba(185,112,92,.10)}
  .opt.sel:after{content:"✓";position:absolute;top:6px;right:9px;font-size:11px;font-weight:700;color:var(--accent-deep)}

  /* 操作 */
  .nav{position:sticky;bottom:0;display:flex;gap:10px;align-items:center;
       padding:14px 0 calc(16px + env(safe-area-inset-bottom));
       background:linear-gradient(to top,var(--bg) 62%,rgba(250,247,245,0))}
  .btn{flex:1;border:0;border-radius:99px;padding:15px 16px;font:inherit;font-weight:700;font-size:15px;
       cursor:pointer;transition:.16s;color:#fff;background:var(--accent);box-shadow:0 6px 16px rgba(185,112,92,.28)}
  .btn:disabled{background:#DCD3CD;box-shadow:none}
  .btn:active:not(:disabled){transform:translateY(1px)}
  .back{flex:0 0 auto;width:52px;padding:15px 0;border-radius:99px;border:1.5px solid var(--line);
        background:var(--card);color:var(--sub);font:inherit;font-size:16px;cursor:pointer}
  .cnt{text-align:center;font-size:12px;color:var(--sub);margin-top:10px;min-height:18px}

  /* 結果 */
  .sum{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:18px}
  .sum dt{font-size:10.5px;color:var(--sub);letter-spacing:.08em}
  .sum dd{margin:1px 0 8px;font-size:13.5px;font-weight:600}
  .sum dd:last-child{margin-bottom:0}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
  .card.top{border-color:var(--accent);box-shadow:0 0 0 3px rgba(185,112,92,.10),var(--shadow)}
  .head{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .rank{display:inline-flex;align-items:center;font-size:10.5px;font-weight:700;letter-spacing:.08em;
        color:var(--accent-deep);background:var(--accent-soft);border-radius:99px;padding:4px 10px}
  .badge{font-size:10.5px;font-weight:700;color:#fff;background:var(--accent-deep);border-radius:99px;padding:4px 9px}
  .cname{margin:10px 0 2px;font-size:17px;font-weight:700;line-height:1.42;letter-spacing:-.01em}
  .meta{color:var(--sub);font-size:12.5px;margin:0 0 10px}
  .meta b{color:var(--ink);font-size:16px;font-weight:700}
  .meta s{color:#B5AAA3;font-size:12px;margin-left:3px;text-decoration-thickness:1px}
  .badge.camp{background:var(--accent)}
  .desc{font-size:13px;color:#5C534E;margin:0 0 12px}
  .score{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .score .t{flex:1;height:6px;background:var(--line);border-radius:99px;overflow:hidden}
  .score .t i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;
              transition:width .9s cubic-bezier(.2,.8,.2,1)}
  .score .v{font-size:11.5px;font-weight:700;color:var(--accent-deep);white-space:nowrap}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
  .tag{font-size:11px;background:var(--accent-soft);border:1px solid #EED9CF;color:var(--accent-deep);
       border-radius:99px;padding:4px 9px;font-weight:600}
  .line-btn{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;border:0;border-radius:99px;
            padding:14px;background:var(--green);color:#fff;font:inherit;font-weight:700;font-size:14.5px;
            cursor:pointer;box-shadow:0 6px 16px rgba(6,199,85,.25)}
  .line-btn:active{transform:translateY(1px)}
  .line-btn.ghost{background:var(--card);color:var(--accent-deep);border:1.5px solid var(--accent);box-shadow:none}
  .line-btn svg{width:17px;height:17px;fill:currentColor;flex:0 0 auto}
  .foot{margin-top:22px;padding-bottom:calc(8px + env(safe-area-inset-bottom))}
  .foot p{font-size:12.5px;color:var(--sub);text-align:center;margin:0 0 12px}
  .again{display:block;width:100%;margin-top:10px;background:none;border:0;color:var(--sub);
         font:inherit;font-size:13px;text-decoration:underline;cursor:pointer;padding:10px}
  .note{font-size:10.5px;color:#A79C96;text-align:center;margin-top:14px;line-height:1.7}
  .env{display:inline-block;font-size:10px;letter-spacing:.04em;color:#A79C96;background:#F2ECE8;
       border-radius:99px;padding:3px 9px;margin-top:8px}

  /* トースト */
  .toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);opacity:0;pointer-events:none;
         background:rgba(43,39,36,.94);color:#fff;font-size:13px;font-weight:600;padding:11px 18px;
         border-radius:99px;transition:.28s;z-index:50;max-width:88vw;text-align:center}
  .toast.on{opacity:1;transform:translate(-50%,0)}
</style>

   desc:'痛みが少ないLED脱毛でヒゲを。毎日の髭剃り負担を減らしたい方へ。'},
  {name:'体毛が濃いメンズへ LED脱毛 初回体験', price:2200, min:20, cat:'メンズ', badge:'新規限定',
   concerns:['mens','hair'], paces:['trial','quick'],
   desc:'1部位20分以内。体毛の濃さが気になる男性の初回体験メニューです。'}
];

/* ---------- 状態 ---------- */
var state = {step:1, concerns:[], budget:null, pace:null};
var main  = document.getElementById('main');
function label(arr,id){ for(var i=0;i<arr.length;i++){ if(arr[i].id===id) return arr[i].label; } return ''; }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* =====================================================================
   マッチングロジック（条件フィルタリング型）
   お悩み一致 +2 / 予算ぴったり +3・隣の価格帯 +1 / 通い方一致 +3
   ===================================================================== */
/* 実際にお支払いいただく金額（キャンペーン価格があればそちら）で価格帯を判定 */
function payPrice(c){ return c.camp || c.price; }
function tierOf(price){ return price<=5500 ? 1 : price<=10000 ? 2 : price<=15000 ? 3 : 4; }

function scoreCourse(c){
  var hits = [], score = 0, i;

  // ① お悩み
  var matched = [];
  for(i=0;i<c.concerns.length;i++){
    if(state.concerns.indexOf(c.concerns[i])>=0) matched.push(c.concerns[i]);
  }
  score += matched.length * 2;
  for(i=0;i<matched.length;i++) hits.push(label(CONCERNS,matched[i]) + ' に対応');

  // ② 予算
  var b = null;
  for(i=0;i<BUDGETS.length;i++){ if(BUDGETS[i].id===state.budget) b = BUDGETS[i]; }
  var t = tierOf(payPrice(c));
  if(b.tier === 0){ score += 2; hits.push('価格帯おまかせ'); }
  else if(b.tier === t){ score += 3; hits.push('ご予算にぴったり'); }
  else if(Math.abs(b.tier - t) === 1){ score += 1; hits.push('ご予算に近い'); }

  // ③ 通い方
  if(c.paces.indexOf(state.pace)>=0){
    score += 3;
    hits.push(label(PACES,state.pace).replace(/したい$/,'').replace(/で$/,'') + ' に最適');
  }

  var max = state.concerns.length*2 + 3 + 3;
  return {course:c, score:score, hits:hits, rate:Math.round(score/max*100), matched:matched.length};
}

function getResults(){
  var ranked = COURSES.map(scoreCourse).sort(function(a,b){
    return (b.score - a.score) || (payPrice(a.course) - payPrice(b.course));
  });
  // 悩みが1つも一致しないコースは出さない（条件フィルタリングの筋を通す）
  var hit = ranked.filter(function(r){ return r.matched > 0; }).slice(0,3);
  return hit.length ? hit : ranked.slice(0,2);
}

/* =====================================================================
   LIFF 連携
   ===================================================================== */
var liffReady = false;        // sendMessages が使える状態か
var liffProfile = null;
var envLabel = 'テスト版（LINE連携は未接続）';

function initLiff(){
  if(typeof liff === 'undefined'){ return; }                       // SDK未読込（ブラウザ確認時）
  if(!LIFF_ID || LIFF_ID.indexOf('x') === 0){ envLabel = 'テスト版（LINE連携は未設定）'; return; }
  liff.init({ liffId: LIFF_ID }).then(function(){
    if(!liff.isLoggedIn() && !liff.isInClient()){ liff.login(); return; }
    liffReady = liff.isApiAvailable('sendMessages');
    envLabel  = liffReady ? 'LINEアプリ内で表示中' : 'LIFF接続済み（外部ブラウザ）';
    return liff.getProfile().then(function(p){ liffProfile = p; }).catch(function(){});
  }).catch(function(e){
    console.error('[LIFF] init failed', e);
    envLabel = 'LIFF初期化エラー（プレビュー動作）';
  });
}

/* トークに送るテキストを組み立てる */
function buildMessage(course){
  var results = getResults();
  var lines = [
    '【コース診断からのご相談】',
    '',
    '■ お悩み：' + state.concerns.map(function(id){ return label(CONCERNS,id); }).join('、'),
    '■ ご予算：' + label(BUDGETS,state.budget),
    '■ 通い方：' + label(PACES,state.pace),
    '',
    '■ 気になるコース：'
  ];
  function line(c){
    return '・' + c.name + '（¥' + payPrice(c).toLocaleString() + (c.camp ? '／キャンペーン価格' : '') + '）';
  }
  if(course){
    lines.push(line(course));
  }else{
    results.forEach(function(r){ lines.push(line(r.course)); });
  }
  lines.push('', 'この内容で相談したいです。');
  return lines.join('\n');
}

function toast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  setTimeout(function(){ t.classList.remove('on'); }, 2400);
}

/* 相談ボタン：LIFF内ならトークへ送信して閉じる／外ならプレビュー表示 */
function sendToLine(course){
  var text = buildMessage(course);

  if(liffReady){
    liff.sendMessages([{ type:'text', text:text }]).then(function(){
      toast('LINEのトークに送信しました');
      setTimeout(function(){ liff.closeWindow(); }, 900);
    }).catch(function(e){
      console.error('[LIFF] sendMessages failed', e);
      toast('送信に失敗しました。もう一度お試しください');
    });
    return;
  }
  // フォールバック（PCブラウザ / LIFF未設定時の動作確認用）
  alert('【LINEトークに送信される内容】\n\n' + text);
}

/* =====================================================================
   画面描画
   ===================================================================== */
function optionHTML(o, selected){
  return '<button class="opt' + (selected?' sel':'') + '" data-id="' + o.id + '">'
       + (o.em ? '<span class="em">' + o.em + '</span>' : '')
       + '<span><b>' + o.label + '</b>' + (o.sub ? '<small>' + o.sub + '</small>' : '') + '</span></button>';
}

function render(){
  var bar = [1,2,3].map(function(n){ return '<i class="' + (state.step>=n?'on':'') + '"></i>'; }).join('');
  document.getElementById('bar').innerHTML = bar;
  document.getElementById('hdStep').textContent = state.step<=3 ? '質問 ' + state.step + ' / 3' : '診断結果';
  window.scrollTo(0,0);
  if(state.step===1) return renderStep1();
  if(state.step===2) return renderStep2();
  if(state.step===3) return renderStep3();
  renderResult();
}

function renderStep1(){
  var hello = liffProfile ? esc(liffProfile.displayName) + 'さん、' : '';
  main.className = 'fade';
  main.innerHTML =
      '<h2 class="q">' + hello + 'いま気になる<br>お悩みを教えてください</h2>'
    + '<p class="qs">あてはまるものをすべて選択（複数可）</p>'
    + '<div class="opts two" id="opts">'
    + CONCERNS.map(function(o){ return optionHTML(o, state.concerns.indexOf(o.id)>=0); }).join('')
    + '</div><p class="cnt" id="cnt"></p>'
    + '<div class="nav"><button class="btn" id="next" disabled>次へ進む</button></div>';

  var cnt = document.getElementById('cnt'), next = document.getElementById('next');
  function sync(){
    cnt.textContent = state.concerns.length ? state.concerns.length + 'つ選択中' : '';
    next.disabled = state.concerns.length === 0;
  }
  document.getElementById('opts').addEventListener('click', function(e){
    var b = e.target.closest('.opt'); if(!b) return;
    var i = state.concerns.indexOf(b.dataset.id);
    if(i < 0){ state.concerns.push(b.dataset.id); } else { state.concerns.splice(i,1); }
    b.classList.toggle('sel', i < 0);
    sync();
  });
  next.onclick = function(){ state.step = 2; render(); };
  sync();
}

function renderStep2(){
  main.className = 'fade';
  main.innerHTML =
      '<h2 class="q">1回あたりのご予算は<br>どのくらいですか？</h2>'
    + '<p class="qs">表示はすべて税込価格です</p>'
    + '<div class="opts" id="opts">'
    + BUDGETS.map(function(o){ return optionHTML(o, state.budget===o.id); }).join('')
    + '</div><div class="nav"><button class="back" id="back">←</button>'
    + '<button class="btn" id="next"' + (state.budget?'':' disabled') + '>次へ進む</button></div>';
  bindSingle('budget');
}

function renderStep3(){
  main.className = 'fade';
  main.innerHTML =
      '<h2 class="q">どんなペースで<br>通いたいですか？</h2>'
    + '<p class="qs">近いものを1つ選んでください</p>'
    + '<div class="opts" id="opts">'
    + PACES.map(function(o){ return optionHTML(o, state.pace===o.id); }).join('')
    + '</div><div class="nav"><button class="back" id="back">←</button>'
    + '<button class="btn" id="next"' + (state.pace?'':' disabled') + '>結果を見る</button></div>';
  bindSingle('pace');
}

function bindSingle(key){
  var next = document.getElementById('next');
  document.getElementById('opts').addEventListener('click', function(e){
    var b = e.target.closest('.opt'); if(!b) return;
    state[key] = b.dataset.id;
    var all = document.querySelectorAll('.opt');
    for(var i=0;i<all.length;i++) all[i].classList.toggle('sel', all[i] === b);
    next.disabled = false;
  });
  document.getElementById('back').onclick = function(){ state.step--; render(); };
  next.onclick = function(){ state.step++; render(); };
}

var LINE_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C6.5 2 2 5.6 2 10.1c0 4 3.6 7.4 8.4 8 .3.1.8.2.9.5.1.3.1.7 0 1l-.1.9c0 .3-.2 1 .9.6 1.1-.5 6-3.5 8.2-6C21.6 13.4 22 11.8 22 10.1 22 5.6 17.5 2 12 2zM8 12.8H6.1c-.3 0-.5-.2-.5-.5V8.5c0-.3.2-.5.5-.5s.5.2.5.5v3.3H8c.3 0 .5.2.5.5s-.2.5-.5.5zm2-.5c0 .3-.2.5-.5.5s-.5-.2-.5-.5V8.5c0-.3.2-.5.5-.5s.5.2.5.5v3.8zm4.6 0c0 .2-.1.4-.4.5h-.2c-.2 0-.3-.1-.4-.2l-1.9-2.6v2.3c0 .3-.2.5-.5.5s-.5-.2-.5-.5V8.5c0-.2.1-.4.4-.5h.2c.1 0 .3.1.4.2l1.9 2.6V8.5c0-.3.2-.5.5-.5s.5.2.5.5v3.8zm3.1-2.4c.3 0 .5.2.5.5s-.2.5-.5.5h-1.4v.9h1.4c.3 0 .5.2.5.5s-.2.5-.5.5h-1.9c-.3 0-.5-.2-.5-.5V8.5c0-.3.2-.5.5-.5h1.9c.3 0 .5.2.5.5s-.2.5-.5.5h-1.4v.9h1.4z"/></svg>';

function renderResult(){
  var results = getResults();

  var cards = results.map(function(r,i){
    var c = r.course, pay = payPrice(c);
    return '<article class="card' + (i===0?' top':'') + '">'
      + '<div class="head"><span class="rank">' + (i===0 ? '★ もっとも条件に近い' : '第' + (i+1) + '候補') + '</span>'
      + (c.badge ? '<span class="badge">' + c.badge + '</span>' : '')
      + (c.camp ? '<span class="badge camp">キャンペーン価格</span>' : '') + '</div>'
      + '<h3 class="cname">' + c.name + '</h3>'
      + '<p class="meta"><b>¥' + pay.toLocaleString() + '</b> 税込'
      + (c.camp ? '<s>¥' + c.price.toLocaleString() + '</s>' : '')
      + (c.min ? ' ／ ' + c.min + '分' : '') + ' ／ ' + c.cat + '</p>'
      + '<div class="score"><span class="t"><i data-w="' + r.rate + '"></i></span>'
      + '<span class="v">条件一致 ' + r.rate + '%</span></div>'
      + '<p class="desc">' + c.desc + '</p>'
      + '<div class="tags">' + r.hits.map(function(h){ return '<span class="tag">' + h + '</span>'; }).join('') + '</div>'
      + '<button class="line-btn" data-i="' + i + '">' + LINE_ICON + 'このコースを相談する</button>'
      + '</article>';
  }).join('');

  main.className = 'fade';
  main.innerHTML =
      '<h2 class="q">条件に合うコースが<br>' + results.length + '件見つかりました</h2>'
    + '<p class="qs">選ばれた条件との一致度が高い順に表示しています</p>'
    + '<dl class="sum">'
    + '<dt>お悩み</dt><dd>' + state.concerns.map(function(id){ return label(CONCERNS,id); }).join('、') + '</dd>'
    + '<dt>ご予算</dt><dd>' + label(BUDGETS,state.budget) + '</dd>'
    + '<dt>通い方</dt><dd>' + label(PACES,state.pace) + '</dd></dl>'
    + cards
    + '<div class="foot">'
    + '<p>迷ったら、このままご相談ください。<br>選んだ条件をスタッフが確認してお返事します。</p>'
    + '<button class="line-btn ghost" id="askAll">' + LINE_ICON + '候補をまとめて相談する</button>'
    + '<button class="again" id="again">条件を選び直す</button>'
    + '<p class="note">ビューティサロン ミエーレ（茨城県古河市本町3-19-1 Anesisビル／古河駅 徒歩8分）<br>'
    + 'キャンペーン価格は期間により変更・終了する場合があります。<br>'
    + '掲載価格・内容の最新情報はご相談時にご確認ください。<br>'
    + '<span class="env">' + envLabel + '</span></p>'
    + '</div>';

  requestAnimationFrame(function(){
    var bars = document.querySelectorAll('.score i');
    for(var i=0;i<bars.length;i++) bars[i].style.width = bars[i].dataset.w + '%';
  });

  main.addEventListener('click', function(e){
    var b = e.target.closest('.line-btn'); if(!b) return;
    sendToLine(b.id === 'askAll' ? null : results[Number(b.dataset.i)].course);
  });
  document.getElementById('again').onclick = function(){
    state = {step:1, concerns:[], budget:null, pace:null};
    render();
  };
}

initLiff();
render();
</script>
